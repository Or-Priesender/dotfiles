set -g prefix C-b
bind C-b send-prefix
# for Pi
set -g extended-keys on
set -g extended-keys-format csi-u

# Better colors and status bar
set -g default-terminal "screen-256color"
set -g status-bg colour235
set -g status-fg colour255
set -g status-left-length 40
set -g status-right "#[fg=yellow]#S #[fg=cyan]%d %b %R"

# Faster command sequences
set -s escape-time 0

# Increase history limit
set -g history-limit 50000

# Vi-style copy mode
setw -g mode-keys vi
# Make 'y' yank in copy mode
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel
# Enhanced copy mode with rectangle selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi Escape send-keys -X cancel

setw -g mouse on
# start windows numbering at 1
set -g base-index 1

# Vi-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Quick pane switching with Alt+arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vi-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Better window switching
bind -n M-h previous-window
bind -n M-l next-window

# Auto-rename windows
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_path}'
set -g renumber-windows on

# Activity monitoring
setw -g monitor-activity off
set -g visual-activity off

# Replace the default split-window binding
bind s choose-tree
bind - split-window -v  # horizontal split
bind | split-window -h  # vertical split

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
# ---------------------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux Config Reloaded!"

# tmux-sessionizer (tms) integration
bind-key o display-popup -w 80% -h 70% -E "~/.config/tmux/pick.sh"
bind-key s display-popup -w 80% -h 70% -E "~/.config/tmux/pick.sh windows"
bind-key S choose-tree
bind-key X run-shell "tms kill"

# Switch to last (most recent) window
bind-key \; last-window

# Auto-setup new sessions with vim and pi (only in ~/dev/ and ~/.config/)
# Disabled 2026-09-29, uncomment to restore:
# set-hook -g after-new-session 'run-shell -b "$HOME/.config/tmux/auto-setup.sh #{pane_current_path} #{session_name}"'

# Popup apps
bind -r g display-popup -d '#{pane_current_path}' -w 80% -h 80% -E "lazygit"

# Windows workflow: status bar with the 5 most recent windows and agent status.
# @agent is set by Claude hooks (agent-status.sh set ...), @mru_show by agent-status.sh refresh.
set -g status-left '#[fg=colour255,bold] #S #[fg=colour240]│'
set -g status-right '#{?@hidden_count,#[fg=colour244]+#{@hidden_count} more ,}#{?@hidden_waiting,#[fg=yellow]#{@hidden_waiting} waiting ● ,}#[fg=cyan]%d %b %R '
set -g status-right-length 60
set -g window-status-separator ''
setw -g window-status-format '#{?@mru_show,#[fg=colour248] #I #W#{?@dup, (#{@dup}),}#{?#{==:#{@agent},waiting},#[fg=yellow] ●,}#{?#{==:#{@agent},running},#[fg=green] ◐,}#{?#{==:#{@agent},done},#[fg=colour67] ✓,} ,}'
setw -g window-status-current-format '#[bg=colour240,fg=colour255,bold] #I #W#{?@dup, (#{@dup}),}#{?#{==:#{@agent},waiting},#[fg=yellow] ●,}#{?#{==:#{@agent},running},#[fg=green] ◐,} '
set-hook -g session-window-changed 'run-shell -b "~/.config/tmux/agent-status.sh refresh #{q:session_id}"'
set-hook -g client-session-changed 'run-shell -b "~/.config/tmux/agent-status.sh refresh #{q:session_id}"'
set-hook -g after-new-window 'run-shell -b "~/.config/tmux/agent-status.sh refresh #{q:session_id}"'
set-hook -g window-unlinked 'run-shell -b "~/.config/tmux/agent-status.sh refresh"'
run-shell -b '~/.config/tmux/agent-status.sh refresh'

# prefix + n: new named window in ~/dev
bind-key n command-prompt -p 'window name:' "new-window -n '%%' -c $HOME/dev"
